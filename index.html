<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM26 Kaderanalyse</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>FM26 Kaderanalyse</h1>
    <p>FM26-CSV-Export importieren und Kader anzeigen</p>
  </header>

  <main>
    <section id="import-section">
      <label for="csv-file">CSV-Datei auswählen:</label>
      <input type="file" id="csv-file" accept=".csv">
      <div id="import-status"></div>
      <div class="filter-field reference-date-field">
        <label for="reference-date">Aktuelles Spieldatum (optional, für Vertrags-Hinweise)</label>
        <input type="date" id="reference-date">
      </div>
    </section>

    <section id="data-section" hidden>
      <h2>Kader (<span id="row-count">0</span> Spieler)</h2>
      <div id="position-gaps" class="position-gaps"></div>
      <div id="filters" class="filters"></div>
      <div id="table-wrapper"></div>
    </section>
  </main>

  <script src="js/csvParser.js"></script>
  <script src="js/players.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
